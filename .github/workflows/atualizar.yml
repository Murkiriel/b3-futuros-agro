name: Atualizar dados

on:
  schedule:
    # 21:30 de Brasília, de segunda a sexta (00:30 UTC de terça a sábado): pega o pregão
    # do dia, normalmente publicado pela B3 até ~20h40.
    - cron: "30 0 * * 2-6"
    # 08:00 de Brasília, de terça a sábado: confirma a versão final do pregão anterior.
    - cron: "0 11 * * 2-6"
  workflow_dispatch:
    inputs:
      argumentos:
        description: "Argumentos extras do script (ex.: --inicio 2026-10-01 --refazer)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar pregões da B3
        id: coleta
        env:
          ARGUMENTOS: ${{ github.event.inputs.argumentos }}
        run: |
          # Dias com erro não impedem a gravação dos demais; a falha é sinalizada no fim.
          python b3_futuros_agro.py $ARGUMENTOS || echo "falhou=1" >> "$GITHUB_OUTPUT"

      - name: Gravar dados no repositório
        id: gravar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Nada novo para gravar."
          else
            git commit -m "Dados: atualização $(TZ=America/Sao_Paulo date +%F\ %H:%M)"
            git pull --rebase --autostash
            git push
            echo "mudou=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar release do último pregão
        env:
          GH_TOKEN: ${{ github.token }}
          MUDOU: ${{ steps.gravar.outputs.mudou }}
        run: |
          python notas_release.py notas.md > release.txt
          tag="$(sed -n 's/^tag=//p' release.txt)"
          titulo="$(sed -n 's/^titulo=//p' release.txt)"
          arquivos="b3_futuros_agro.xlsx dados/b3_futuros_agro.csv"
          if gh release view "$tag" > /dev/null 2>&1; then
            # O release do pregão já existe (ex.: criado às 21h30 com a versão provisória):
            # só troca os arquivos e as notas quando os dados mudaram.
            if [ "$MUDOU" = "1" ]; then
              gh release upload "$tag" $arquivos --clobber
              gh release edit "$tag" --title "$titulo" --notes-file notas.md
              echo "Release $tag atualizado."
            else
              echo "Release $tag já está em dia."
            fi
          else
            gh release create "$tag" $arquivos --title "$titulo" --notes-file notas.md \
              --target "$(git rev-parse HEAD)" --latest
            echo "Release $tag criado."
          fi

      - name: Sinalizar dias com erro
        if: steps.coleta.outputs.falhou == '1'
        run: |
          echo "::error::Algum pregão não pôde ser baixado; veja o log da etapa 'Baixar pregões da B3'. Ele será tentado de novo na próxima execução."
          exit 1
